[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sztu-connect"
version = "0.1.0"
description = "Event-centered, source-linked archive tooling for SZTU Connect"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "jsonschema>=4.20,<5"
]

[project.urls]
Repository = "https://github.com/Shuang-su/sztu-connect"

[project.scripts]
sztu-connect = "sztu_connect.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
